name: Build and deploy RheelTech website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify production build configuration
        env:
          VITE_SUPABASE_URL: ${{ vars.PRODUCTION_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.PRODUCTION_SUPABASE_PUBLISHABLE_KEY }}
          VITE_CAREERS_GATEWAY_URL: ${{ vars.PRODUCTION_CAREERS_GATEWAY_URL }}
          VITE_BASE_PATH: /RheelTech/
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo "Missing PRODUCTION_SUPABASE_URL repository variable"; exit 1; }
          test -n "$VITE_SUPABASE_ANON_KEY" || { echo "Missing PRODUCTION_SUPABASE_PUBLISHABLE_KEY repository variable"; exit 1; }
          test -n "$VITE_CAREERS_GATEWAY_URL" || { echo "Missing PRODUCTION_CAREERS_GATEWAY_URL repository variable"; exit 1; }
      - name: Build production site
        run: pnpm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.PRODUCTION_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.PRODUCTION_SUPABASE_PUBLISHABLE_KEY }}
          VITE_CAREERS_GATEWAY_URL: ${{ vars.PRODUCTION_CAREERS_GATEWAY_URL }}
          VITE_BASE_PATH: /RheelTech/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
